services:
  db:
    image: postgres:18
    container_name: waypoint_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: waypoint_pulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - waypoint_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d waypoint_pulse"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    container_name: waypoint_api
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/waypoint_pulse
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PYTHONUNBUFFERED: "1"

    command:
      - sh
      - -c
      - |
        python -u -m scripts.seed &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000

    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000

    container_name: waypoint_web
    restart: unless-stopped

    depends_on:
      - api

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

    ports:
      - "3000:3000"

volumes:
  waypoint_postgres_data: